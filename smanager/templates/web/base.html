<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SManager Dashboard{% endblock %}</title>
  <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="{{ url_for('static', filename='web.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='web.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <h2>Confirm action</h2>
      <p id="confirm-message">Continue?</p>
      <div class="dialog-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn danger" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
